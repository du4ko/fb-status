name: Проверка на страниците
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pages.json', 'check.mjs', '.github/workflows/check.yml']
permissions:
  contents: write
concurrency:
  group: check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node check.mjs
      - name: Запис на резултатите
        run: |
          git config user.name "status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          cp -r data "$RUNNER_TEMP/data"
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            rm -rf data && cp -r "$RUNNER_TEMP/data" data
            git add data/
            if git diff --cached --quiet; then echo "Няма промени"; exit 0; fi
            git commit -qm "Статус $(date -u +%FT%TZ)"
            if git push -q origin HEAD:main; then exit 0; fi
            echo "Push неуспешен, нов опит ($i)"; sleep 5
          done
          exit 1
